# ============================================================
#  容器版 nginx 配置（跑在 nginx 容器里）
# ------------------------------------------------------------
#  和你本机那份 D:\mayiran-work\tools\nginx-1.30.4\conf\nginx.conf 比，
#  只有两个地方不一样：
#    ① listen 用 80（容器内部端口，宿主机映射成 8081）
#    ② proxy_pass 写的是服务名 java，不是 127.0.0.1
#       —— 容器里的 127.0.0.1 指的是"nginx 自己"，
#          写 127.0.0.1:8080 会转到一个根本不存在的服务上。
# ============================================================
server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  login.html;

    charset utf-8;
    client_max_body_size 20m;

    access_log  /var/log/nginx/commerce-access.log;
    error_log   /var/log/nginx/commerce-error.log;

    # ---------- 1. 前端页面 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 2. 静态资源 ----------
    # 开发阶段不开缓存，改完刷新就能看到效果
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------- 3. 接口反代到 Spring Boot 容器 ----------
    location /api/ {
        # 🔴 为什么这里要用变量 + resolver，而不是直接写 proxy_pass http://java:8080;
        #
        # nginx 对 proxy_pass 里【写死的域名】只在启动时解析一次，之后永久缓存 IP。
        # 而容器重建后 IP 是会变的 —— 于是 nginx 一直往那个已经消失的旧 IP 发请求，
        # 前端看到的就是 502 Bad Gateway。
        # 这个现象特别容易误判成"Java 服务挂了"，其实 Java 活得好好的。
        #
        # 解法：用 Docker 内嵌 DNS（127.0.0.11）+ 变量，nginx 每 10 秒重新解析一次，
        # 容器重建后最多 10 秒自动恢复，不需要手动重启 nginx。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $java_upstream http://java:8080;
        # ⚠️ proxy_pass 用变量时，nginx 不会再做"替换 location 前缀"的动作，
        # 而是原样转发完整 URI —— 这里正需要这样（/api/xxx 要原样带给 Java）。
        proxy_pass $java_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话接口要等大模型，超时别设太短，否则会 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 4. 内部接口绝对不对外暴露 ----------
    location /internal/ {
        deny all;
        return 403;
    }

    # ---------- 5. gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json;
}
