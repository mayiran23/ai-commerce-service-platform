<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发用免登录入口 · 智联商城智能客服平台</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { width: 520px; }
  .devtag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px;
            background: var(--warn-weak); color: var(--warn); margin-left: 8px; }
  .role { display:flex; align-items:center; gap:12px; padding:12px 14px; margin-top:10px;
          border:1px solid var(--line); border-radius:10px; cursor:pointer; background: var(--panel); }
  .role:hover { border-color:#cfd6e6; background: var(--panel-2); }
  .role b { font-size:13px; }
  .role .who { color: var(--text-3); font-size:12px; margin-left:auto; }
  .warnbox { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:12.5px;
             line-height:1.7; background: var(--warn-weak); color: var(--warn); }
  code { background: rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>

<div class="box">
  <div class="card">
    <div class="card-hd">
      <h3>开发用免登录入口<span class="devtag">仅开发</span></h3>
    </div>
    <div class="card-bd">
      <div style="font-size:13px;color:var(--text-2);line-height:1.7">
        直接写入本地登录态并跳转，绕过还没实现的 <code>POST /api/auth/login</code>。
        点一个身份进去：
      </div>

      <div id="roles"></div>

      <div class="warnbox">
        <b>为什么可以这样绕过</b><br>
        前端 <code>UI.requireLogin()</code> 只检查 localStorage 里有没有 <code>cs_token</code>；
        而后端目前<b>还没有 JWT 拦截器</b>，这个 token 不会被校验。
        等 9/17 写完登录接口和拦截器，这个页面就该删掉。
      </div>

      <button class="btn block mt12" id="clear">清除登录态（回到未登录）</button>
    </div>
  </div>
</div>

<script src="assets/ui.js"></script>
<script>
var ROLES = [
  { id: 108, username: 'user0108', nickname: '郭思远', role: 'AGENT',  roleText: '客服',     desc: '可看全部订单' },
  { id: 92,  username: 'user0092', nickname: '何皓宇', role: 'ADMIN',  roleText: '管理员',   desc: '可看全部订单' },
  { id: 1,   username: 'user0001', nickname: '谢雨欣', role: 'USER',   roleText: '普通用户', desc: '只看自己的单' }
];

UI.$('#roles').innerHTML = ROLES.map(function (r, i) {
  return '<div class="role" data-i="' + i + '">'
    + '<b>' + UI.esc(r.roleText) + '</b>'
    + UI.esc(r.nickname)
    + '<span class="who">' + UI.esc(r.desc) + '</span>'
  + '</div>';
}).join('');

UI.$$('#roles .role').forEach(function (el) {
  el.onclick = function () {
    var r = ROLES[parseInt(el.getAttribute('data-i'), 10)];
    var user = { id: r.id, username: r.username, nickname: r.nickname, role: r.role, roleText: r.roleText };
    try {
      localStorage.setItem('cs_token', 'dev-token-' + r.username);
      localStorage.setItem('cs_user', JSON.stringify(user));
    } catch (e) {
      document.body.innerHTML = '<div class="card"><div class="card-bd">'
        + 'localStorage 写入失败：' + UI.esc(e.message) + '</div></div>';
      return;
    }
    location.href = 'orders.html';
  };
});

UI.$('#clear').onclick = function () {
  try { localStorage.removeItem('cs_token'); localStorage.removeItem('cs_user'); } catch (e) {}
  location.href = 'login.html';
};
</script>
</body>
</html>
