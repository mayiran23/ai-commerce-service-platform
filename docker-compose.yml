services:
  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ai:
    build: ./ai-service
    image: commerce-service/ai:local
    container_name: commerce-ai
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JAVA_BASE_URL: http://java:8080
      # ⚠️ 临时方案：百炼 embedding 免费额度用尽，向量检索调不通。
      #    改走 BM25（纯关键词，不需要 embedding），仅用于验证全链路。
      #    额度恢复后【删掉这一行】，回到默认的 vector 策略。
      RAG_STRATEGY: bm25
    volumes:
      - chroma-data:/app/chroma_db
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  java:
    build: .
    image: commerce-service/java:local
    container_name: commerce-java
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/commerce_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      AI_SERVICE_URL: http://ai:8000
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    image: commerce-service/nginx:local
    container_name: commerce-nginx
    depends_on:
      - java
    ports:
      - "8081:80"
    restart: unless-stopped


volumes:
  mysql-data:
  chroma-data:
